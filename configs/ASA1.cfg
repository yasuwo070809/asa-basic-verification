! =============================================================
! ASA1 running-config -- PARTIAL CAPTURE ONLY
!
! A single consolidated `show running-config` could NOT be captured
! for ASA1. During evidence re-capture, ASA1's console (line 0) began
! streaming what appeared to be a Linux /proc/<pid>/maps-style memory
! dump (referencing /usr/lib64/dpdk/pmds-23.0/librte_*.so libraries)
! instead of responding to CLI input. This was observed across
! multiple fresh console connections and is documented factually in
! docs/troubleshooting.md. No reload or other recovery action was
! attempted.
!
! The two blocks below are real, device-captured fragments obtained
! BEFORE that anomaly appeared (via `show running-config interface`
! and `show running-config policy-map`). Nothing here has been
! reconstructed, guessed, or filled in from memory of what was
! configured -- this file only contains what the device actually
! returned.
!
! Known to be MISSING from this file (present on the live device but
! not re-captured as part of a full dump): `hostname ASA1`,
! `enable password ... pbkdf2` (ASA itself never echoes the real
! value here -- it always prints literal asterisks), `route outside
! 0.0.0.0 0.0.0.0 203.0.113.1 1`, and other boilerplate lines
! (ftp mode, mtu, arp timeout, etc.) visible in earlier captures
! during this session but not re-verified in this final pass.
! =============================================================

! --- from: show running-config interface ---
!
interface GigabitEthernet0/0
 description TO-R-OUT
 nameif outside
 security-level 0
 ip address 203.0.113.2 255.255.255.0
!
interface GigabitEthernet0/1
 description TO-R-IN
 nameif inside
 security-level 100
 ip address 10.10.10.1 255.255.255.0
!
interface Management0/0
 no management-only
 shutdown
 no nameif
 no security-level
 no ip address

! --- from: show running-config policy-map ---
!
policy-map type inspect dns preset_dns_map
 parameters
  message-length maximum client auto
  message-length maximum 512
  no tcp-inspection
policy-map global_policy
 class inspection_default
  inspect rtsp
  inspect sunrpc
  inspect xdmcp
  inspect netbios
  inspect tftp
  inspect ip-options
  inspect dns preset_dns_map
  inspect ftp
  inspect h323 h225
  inspect h323 ras
  inspect rsh
  inspect esmtp
  inspect sqlnet
  inspect sip
  inspect skinny
  inspect icmp
policy-map type inspect dns migrated_dns_map_2
 parameters
  message-length maximum client auto
  message-length maximum 512
  no tcp-inspection
policy-map type inspect dns migrated_dns_map_1
 parameters
  message-length maximum client auto
  message-length maximum 512
  no tcp-inspection
!
